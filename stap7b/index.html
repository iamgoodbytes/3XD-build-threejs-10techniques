<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stap 7b – Emissive: wat het doet (en niet doet)</title>
  <style>
    /* Knoppenbalk linksonder: elke schakelaar toont zijn sneltoets en of hij aan staat */
    #tools { position: fixed; left: 12px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    #tools button, #tools .slider {
      display: flex; align-items: center; gap: 10px; min-width: 290px;
      padding: 7px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.65); color: #fff; font: 14px/1.2 system-ui, sans-serif;
      text-align: left;
    }
    #tools button { cursor: pointer; }
    #tools button:hover { border-color: #ff8a4d; }
    #tools kbd {
      display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 5px;
      background: #fff; color: #000; font: 700 13px/1 ui-monospace, Menlo, monospace;
    }
    #tools .label { flex: 1; }
    #tools .state { font: 600 11px/1 ui-monospace, Menlo, monospace; text-transform: uppercase; color: #8a93a6; min-width: 3.5em; text-align: right; }
    #tools button.on { border-color: rgba(255, 138, 77, 0.8); }
    #tools button.on .state { color: #ffb38a; }
    #tools input[type='range'] { flex: 1; accent-color: #ff8a4d; }

    /* "Kijk naar…": wat je in de huidige stand moet opmerken */
    #observe {
      position: fixed; right: 16px; top: 16px; width: min(380px, 40vw);
      padding: 12px 14px; border-radius: 10px; border-left: 3px solid #ff8a4d;
      background: rgba(0, 0, 0, 0.7); color: #eef; font: 14px/1.5 system-ui, sans-serif;
    }
    #observe h2 { font: 700 11px/1 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #ff8a4d; margin-bottom: 8px; }
    #observe ul { margin-left: 1.1em; }
    #observe li { margin-bottom: 5px; }
    #observe b { color: #fff; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Stap 7b – Emissive: wat het doet (en niet doet)</h1>
    <b>A</b>: enkel een emissive materiaal · <b>B</b>: hetzelfde + een echte <code>PointLight</code><br />
    <b>C</b>: dezelfde oranje als gewone verf (geen emissive), ter vergelijking<br />
    Sleep om rond te draaien, scroll om te zoomen.<br />
    <a href="/">← overzicht</a>
  </div>

  <div id="observe">
    <h2>Kijk naar…</h2>
    <ul id="observe-list"></ul>
  </div>

  <div id="tools">
    <button type="button" data-action="emissive"><kbd>E</kbd><span class="label">Emissive (beide blokken)</span><span class="state"></span></button>
    <button type="button" data-action="light"><kbd>P</kbd><span class="label">PointLight (enkel in B)</span><span class="state"></span></button>
    <button type="button" data-action="bloom"><kbd>G</kbd><span class="label">Gloed (bloom-nabewerking)</span><span class="state"></span></button>
    <button type="button" data-action="day"><kbd>N</kbd><span class="label">Dag / nacht</span><span class="state"></span></button>
    <div class="slider"><kbd>−</kbd><kbd>+</kbd><span class="label">Sterkte</span><input id="intensity" type="range" min="0" max="8" step="0.1" /><span class="state" id="intensity-value"></span></div>
  </div>

  <script type="module" src="../slides/slides.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
